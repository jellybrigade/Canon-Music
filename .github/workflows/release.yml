name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Read version from tauri.conf.json
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create and push tag (once, on Linux runner)
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG" || echo "Tag already exists, skipping"
          git push origin "$TAG" || echo "Tag already pushed, skipping"

      - name: Extract release notes from commit message
        id: notes
        shell: bash
        run: |
          BODY=$(git log -1 --format=%B | tail -n +3)
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libssl-dev \
            pkg-config

      - name: Set up Rust targets (macOS universal)
        if: matrix.platform == 'macos-latest'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # better-sqlite3 is a test-only devDependency, and its node-gyp build is the
      # only thing in this install that needs a C++ toolchain. Skipping every install
      # script keeps a test fixture from failing the release; esbuild is the one
      # script the frontend build actually depends on, so it is run back explicitly.
      - name: Install frontend dependencies
        run: pnpm install --ignore-scripts

      - name: Build esbuild's platform binary
        run: pnpm rebuild esbuild

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_DISCORD_WEBHOOK: ${{ secrets.VITE_DISCORD_WEBHOOK }}
        with:
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: Canon ${{ steps.version.outputs.tag }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
          args: ${{ matrix.args }}

  finalize:
    needs: release
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Rebuild latest.json from all platform artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          gh release download "$TAG" -D /tmp/assets --pattern "*.sig" --repo "$REPO"

          NOTES=$(gh release view "$TAG" --json body --jq '.body' --repo "$REPO")
          PUB_DATE=$(gh release view "$TAG" --json publishedAt --jq '.publishedAt' --repo "$REPO")

          cat > /tmp/build_json.py << 'PYEOF'
          import json, os, glob, sys

          assets = '/tmp/assets'
          base_url = "https://github.com/{}/releases/download/{}".format(os.environ['REPO'], os.environ['TAG'])
          version = os.environ['VERSION']
          notes = os.environ['NOTES']
          pub_date = os.environ['PUB_DATE']

          def entry(sig_path):
              sig = open(sig_path).read().strip()
              binary = sig_path[:-4]  # strip .sig — URL derived from same file, never mismatched
              url = "{}/{}".format(base_url, os.path.basename(binary))
              return sig, url

          def first(pattern):
              files = sorted(glob.glob('{}/{}'.format(assets, pattern)))
              return files[0] if files else None

          platforms = {}

          for sig_pat, keys in [
              ('*.AppImage.sig',   ['linux-x86_64', 'linux-x86_64-appimage']),
              ('*.deb.sig',        ['linux-x86_64-deb']),
              ('*.rpm.sig',        ['linux-x86_64-rpm']),
          ]:
              f = first(sig_pat)
              if f:
                  s, u = entry(f)
                  for k in keys:
                      platforms[k] = {'signature': s, 'url': u}

          f = first('*.app.tar.gz.sig')
          if f:
              s, u = entry(f)
              for k in ['darwin-aarch64', 'darwin-x86_64', 'darwin-aarch64-app', 'darwin-x86_64-app']:
                  platforms[k] = {'signature': s, 'url': u}

          f = first('*_en-US.msi.sig')
          if f:
              s, u = entry(f)
              platforms['windows-x86_64'] = {'signature': s, 'url': u}
              platforms['windows-x86_64-msi'] = {'signature': s, 'url': u}

          f = first('*-setup.exe.sig')
          if f:
              s, u = entry(f)
              platforms['windows-x86_64-nsis'] = {'signature': s, 'url': u}

          if not platforms:
              print('ERROR: no platform entries built — aborting upload', flush=True)
              sys.exit(1)

          result = {'version': version, 'notes': notes, 'pub_date': pub_date, 'platforms': platforms}

          with open('/tmp/latest.json', 'w') as f:
              json.dump(result, f, indent=2)

          print('Platforms in latest.json:', list(platforms.keys()))
          PYEOF

          NOTES="$NOTES" PUB_DATE="$PUB_DATE" python3 /tmp/build_json.py
          gh release upload "$TAG" /tmp/latest.json --clobber --repo "$REPO"
