[graph]
all-features = true

[advisories]
# Unmaintained crates only reached through tauri/gtk can't be replaced from here; flag direct deps only.
unmaintained = "workspace"
ignore = [
  # libsqlite3-sys is held at 0.30 by tauri-plugin-sql 2.x (sqlx 0.8); lift once a stable plugin ships sqlx 0.9.
  { id = "RUSTSEC-2026-0459", reason = "patched libsqlite3-sys unreachable while tauri-plugin-sql 2.x pins sqlx 0.8; needs crafted db + wal in Canon's own data dir" },
]

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9
private = { ignore = true }

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
